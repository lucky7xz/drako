# .goreleaser.yaml
# Visit https://goreleaser.com for documentation.
# Run `goreleaser check` to validate, `goreleaser release --snapshot --clean`
# to dry-run locally.

version: 2

project_name: drako

before:
  hooks:
    - go mod tidy
    # Collect the licences of every module linked into the binary. Generated
    # here so it can never drift from go.mod.
    - sh scripts/third-party-notices.sh

builds:
  - id: drako
    main: .
    binary: drako
    env:
      - CGO_ENABLED=0          # pure Go -> static binaries, run anywhere
    ldflags:
      - -s -w                  # strip debug info for smaller binaries
      - -X github.com/lucky7xz/drako/internal/config.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin           # no 32-bit macOS
        goarch: arm
      - goos: freebsd          # keep the freebsd target minimal
        goarch: arm
      - goos: freebsd
        goarch: arm64

archives:
  - formats: [tar.gz]
    # Listed explicitly because this replaces the defaults — and the defaults
    # match LICENSE*, which never matched our LICENCE.
    files:
      - LICENCE
      - README.md
      - THIRD-PARTY-NOTICES.md
    # uname-compatible names: drako_Linux_x86_64.tar.gz etc.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Linux packages (.deb / .rpm) — built into the release, no external repo needed.
nfpms:
  - id: packages
    package_name: drako
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: "Lucky7xz"
    homepage: "https://github.com/lucky7xz/drako"
    maintainer: "Lucky7xz <lucky7xz@github.com>"
    description: "TUI-Deck launcher for terminal discipline."
    license: "AGPL-3.0"
    formats:
      - deb
      - rpm
    dependencies:
      - git
      # The default shell for unconfigured cells is `bash -lc`
      # (core.fallbackShell), so without it an installed drako runs nothing.
      - bash
    contents:
      - src: LICENCE
        dst: /usr/share/doc/drako/LICENCE
      - src: THIRD-PARTY-NOTICES.md
        dst: /usr/share/doc/drako/THIRD-PARTY-NOTICES.md

release:
  github:
    owner: lucky7xz
    name: drako
  draft: false
  prerelease: auto

# Channels that need external repos + secret tokens (Homebrew tap, AUR, Scoop)
# are intentionally omitted until those repos and secrets exist. Re-add the
# brews / aur / scoops blocks when ready.
