#==========================================
# ┌─ Column A: Working in a box ───────────┐
# └────────────────────────────────────────┘
[[commands]]
name = "🚪 Enter"
description = "Drops you inside an existing box — your terminal becomes that box's terminal, home directory shared the whole time. Pick from whatever you've already created."
command = { linux_generic = """
if ! command -v distrobox >/dev/null 2>&1; then
    echo "❌ distrobox is not installed. Settings ⋮ → Install first."
    exit 1
fi
names=$(distrobox list --no-color 2>/dev/null | awk -F'|' 'NR>1 {gsub(/^[ \t]+|[ \t]+$/, "", $2); if ($2 != "") print $2}')
if [ -z "$names" ]; then
    echo "📦 No boxes yet — create one first (Create ⋮)."
    exit 1
fi
echo "📦 Pick a box:"
i=0
printf '%s\n' "$names" | while IFS= read -r n; do
    i=$((i + 1))
    printf "  %d) %s\n" "$i" "$n"
done
printf "  Choice: "
read choice
case "$choice" in ''|*[!0-9]*) echo "Cancelled."; exit 1 ;; esac
name=$(printf '%s\n' "$names" | sed -n "${choice}p")
if [ -z "$name" ]; then
    echo "❌ No such box."
    exit 1
fi
distrobox enter "$name"
""", macos = "echo '🚫 distrobox is Linux-only — no macOS support.'", windows = "Write-Host '🚫 distrobox is Linux-only — try WSL2 with a Linux distro instead.'" }
col = "A"
row = 0
auto_close_execution = false

[[commands]]
name = "🛑 Stop"
description = "Stops a running box without deleting it — everything inside is exactly as you left it next time you enter. Nothing to worry about here."
command = { linux_generic = """
if ! command -v distrobox >/dev/null 2>&1; then
    echo "❌ distrobox is not installed. Settings ⋮ → Install first."
    exit 1
fi
names=$(distrobox list --no-color 2>/dev/null | awk -F'|' 'NR>1 {gsub(/^[ \t]+|[ \t]+$/, "", $2); if ($2 != "") print $2}')
if [ -z "$names" ]; then
    echo "📦 No boxes yet — create one first (Create ⋮)."
    exit 1
fi
echo "📦 Pick a box:"
i=0
printf '%s\n' "$names" | while IFS= read -r n; do
    i=$((i + 1))
    printf "  %d) %s\n" "$i" "$n"
done
printf "  Choice: "
read choice
case "$choice" in ''|*[!0-9]*) echo "Cancelled."; exit 1 ;; esac
name=$(printf '%s\n' "$names" | sed -n "${choice}p")
if [ -z "$name" ]; then
    echo "❌ No such box."
    exit 1
fi
distrobox stop "$name" --yes
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }
col = "A"
row = 1
auto_close_execution = false

[[commands]]
name = "🧪 Ephemeral"
description = "A box that exists only for as long as you're inside it — the moment you exit, it's gone, no trace left. Perfect for testing something risky without committing to it. (This is the same shape of box THE FORGE spins up for an agent to work in.)"
command = { linux_generic = """
echo "Base image — 1) ubuntu  2) fedora  3) arch  4) custom"
printf "Choice [1]: "; read c
case "${c:-1}" in
    1) img=docker.io/library/ubuntu:24.04 ;;
    2) img=registry.fedoraproject.org/fedora:latest ;;
    3) img=docker.io/library/archlinux:latest ;;
    4) printf "Image: "; read img ;;
    *) echo "Cancelled."; exit 1 ;;
esac
[ -z "$img" ] && { echo "Cancelled."; exit 1; }
distrobox-ephemeral --image "$img"
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }
col = "A"
row = 2
auto_close_execution = false

#==========================================
# ┌─ Column B: Box lifecycle ──────────────┐
# └────────────────────────────────────────┘
[[commands]]
name = "✨ Create ⋮ "
description = "Builds a brand new box from a base image. Pick a common distro or type your own image reference — the box is yours to fill however you like."
col = "B"
row = 0
items = [
    { name = "🐧 Ubuntu", description = "The friendliest default — huge package availability, the safest bet if you're not sure what you need.", command = { linux_generic = """
printf "Box name [ubuntu]: "; read n; n=${n:-ubuntu}
distrobox create --name "$n" --image docker.io/library/ubuntu:24.04 --yes
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }, auto_close_execution = false },
    { name = "🧢 Fedora", description = "Matches a Fedora Atomic/Silverblue host closely — a good pick if you want the box to feel like an extension of the system underneath it.", command = { linux_generic = """
printf "Box name [fedora]: "; read n; n=${n:-fedora}
distrobox create --name "$n" --image registry.fedoraproject.org/fedora:latest --yes
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }, auto_close_execution = false },
    { name = "🔷 Arch", description = "Rolling release, bleeding-edge packages, the AUR. For when you want the newest version of everything, right now.", command = { linux_generic = """
printf "Box name [arch]: "; read n; n=${n:-arch}
distrobox create --name "$n" --image docker.io/library/archlinux:latest --yes
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }, auto_close_execution = false },
    { name = "🎨 Custom image", description = "Any OCI image works — point it at whatever registry reference you need: a specific version, a niche distro, a personal image.", command = { linux_generic = """
printf "Box name: "; read n
[ -z "$n" ] && { echo "Cancelled — a name is required."; exit 1; }
printf "Image (e.g. debian:12, quay.io/toolbx/arch-toolbox:latest): "; read img
[ -z "$img" ] && { echo "Cancelled — an image is required."; exit 1; }
distrobox create --name "$n" --image "$img" --yes
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }, auto_close_execution = false }
]

[[commands]]
name = "🚨 Delete"
description = "Permanently removes a box and everything installed inside it — the base image on your host is untouched, but the box itself is gone for good. Asks you to type the name back before it does anything."
command = { linux_generic = """
if ! command -v distrobox >/dev/null 2>&1; then
    echo "❌ distrobox is not installed. Settings ⋮ → Install first."
    exit 1
fi
names=$(distrobox list --no-color 2>/dev/null | awk -F'|' 'NR>1 {gsub(/^[ \t]+|[ \t]+$/, "", $2); if ($2 != "") print $2}')
if [ -z "$names" ]; then
    echo "📦 No boxes yet — create one first (Create ⋮)."
    exit 1
fi
echo "📦 Pick a box:"
i=0
printf '%s\n' "$names" | while IFS= read -r n; do
    i=$((i + 1))
    printf "  %d) %s\n" "$i" "$n"
done
printf "  Choice: "
read choice
case "$choice" in ''|*[!0-9]*) echo "Cancelled."; exit 1 ;; esac
name=$(printf '%s\n' "$names" | sed -n "${choice}p")
if [ -z "$name" ]; then
    echo "❌ No such box."
    exit 1
fi
echo "🚨 This deletes '$name' permanently. Everything inside it is lost."
printf "Type the box name to confirm: "
read confirm
if [ "$confirm" != "$name" ]; then
    echo "Cancelled — names didn't match."
    exit 1
fi
distrobox rm "$name" --force
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }
col = "B"
row = 1
auto_close_execution = false

