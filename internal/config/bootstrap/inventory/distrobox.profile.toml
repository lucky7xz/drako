# dR4ko — Distrobox
# Terminal-native distrobox management — no separate GUI app needed. Linux-only; macOS/windows variants just say so.

x = 3
y = 3

header_art = """
██████╗ ██╗███████╗████████╗██████╗  ██████╗
██╔══██╗██║██╔════╝╚══██╔══╝██╔══██╗██╔═══██╗
██║  ██║██║███████╗   ██║   ██████╔╝██║   ██║
██║  ██║██║╚════██║   ██║   ██╔══██╗██║   ██║ box
██████╔╝██║███████║   ██║   ██║  ██║╚██████╔╝
