[[commands]]
name = "🚀 Upgrade"
description = "Runs the box's own package-manager update for you, without needing to enter it first. Good habit for any box you keep around a while — don't let it go stale."
command = { linux_generic = """
if ! command -v distrobox >/dev/null 2>&1; then
    echo "❌ distrobox is not installed. Settings ⋮ → Install first."
    exit 1
fi
names=$(distrobox list --no-color 2>/dev/null | awk -F'|' 'NR>1 {gsub(/^[ \t]+|[ \t]+$/, "", $2); if ($2 != "") print $2}')
if [ -z "$names" ]; then
    echo "📦 No boxes yet — create one first (Create ⋮)."
    exit 1
fi
echo "📦 Pick a box:"
i=0
printf '%s\n' "$names" | while IFS= read -r n; do
    i=$((i + 1))
    printf "  %d) %s\n" "$i" "$n"
done
printf "  Choice: "
read choice
case "$choice" in ''|*[!0-9]*) echo "Cancelled."; exit 1 ;; esac
name=$(printf '%s\n' "$names" | sed -n "${choice}p")
if [ -z "$name" ]; then
    echo "❌ No such box."
    exit 1
fi
distrobox upgrade "$name"
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }
col = "C"
row = 1
auto_close_execution = false

[[commands]]
name = "🔧 Settings ⋮ "
description = "Install, remove, or check on distrobox itself — the machinery behind every other cell in this deck."
col = "C"
row = 2
items = [
    { name = "💻 Status", description = "Checks whether distrobox and a container backend (podman or docker) are actually present, and what versions.", command = { linux_generic = """
if command -v distrobox >/dev/null 2>&1; then
    echo "✅ distrobox: $(distrobox version)"
else
    echo "❌ distrobox: not installed"
fi
if command -v podman >/dev/null 2>&1; then
    echo "✅ podman: $(podman --version)"
elif command -v docker >/dev/null 2>&1; then
    echo "✅ docker: $(docker --version)"
else
    echo "❌ no container backend found (need podman or docker)"
fi
""", macos = "echo '🚫 distrobox is Linux-only.'", windows = "Write-Host '🚫 distrobox is Linux-only.'" }, auto_close_execution = false },
    { name = "🧰 Install", description = "Installs distrobox plus podman (the backend it needs) if either is missing. Safe to run again later — it only adds what's not already there.", command = { linux_immutable = "brew install distrobox podman", linux_debian = "sudo apt update && sudo apt install -y distrobox podman", linux_arch = "sudo pacman -S --needed --noconfirm distrobox podman", linux_fedora = "sudo dnf install -y distrobox podman", linux_suse = "sudo zypper install -y distrobox podman", linux_void = "sudo xbps-install -Sy distrobox podman", linux_generic = """
if command -v apt-get >/dev/null 2>&1; then
    sudo apt-get update && sudo apt-get install -y distrobox podman
elif command -v dnf >/dev/null 2>&1; then
    sudo dnf install -y distrobox podman
elif command -v pacman >/dev/null 2>&1; then
    sudo pacman -S --needed --noconfirm distrobox podman
elif command -v zypper >/dev/null 2>&1; then
    sudo zypper install -y distrobox podman
elif command -v xbps-install >/dev/null 2>&1; then
    sudo xbps-install -Sy distrobox podman
elif command -v apk >/dev/null 2>&1; then
    sudo apk add distrobox podman
else
    echo "❓ No known package manager. Install by hand: https://distrobox.it/#installation"
    exit 1
fi
""", macos = "echo '🚫 distrobox is Linux-only — no macOS support.'", windows = "Write-Host '🚫 distrobox is Linux-only — use WSL2 with a Linux distro instead.'" }, auto_close_execution = false },
    { name = "🚨 Uninstall", description = "Removes distrobox and podman from your system. Existing boxes and their container images are untouched by this — they just become unreachable until you reinstall.", command = { linux_immutable = "brew uninstall distrobox podman", linux_debian = "sudo apt remove -y distrobox podman", linux_arch = "sudo pacman -R --noconfirm distrobox podman", linux_fedora = "sudo dnf remove -y distrobox podman", linux_suse = "sudo zypper remove -y distrobox podman", linux_void = "sudo xbps-remove -y distrobox podman", linux_generic = """
echo "🚨 This removes distrobox and podman. Existing boxes become unreachable until you reinstall."
printf "Type CONFIRM to proceed: "
read c
[ "$c" != "CONFIRM" ] && { echo "Cancelled."; exit 1; }
if command -v apt-get >/dev/null 2>&1; then
    sudo apt-get remove -y distrobox podman
elif command -v dnf >/dev/null 2>&1; then
    sudo dnf remove -y distrobox podman
elif command -v pacman >/dev/null 2>&1; then
    sudo pacman -R --noconfirm distrobox podman
elif command -v zypper >/dev/null 2>&1; then
    sudo zypper remove -y distrobox podman
elif command -v xbps-remove >/dev/null 2>&1; then
    sudo xbps-remove -y distrobox podman
elif command -v apk >/dev/null 2>&1; then
    sudo apk del distrobox podman
else
    echo "❓ No known package manager. Remove by hand."
    exit 1
fi
""", macos = "echo '🚫 Nothing to uninstall — distrobox never installs on macOS.'", windows = "Write-Host '🚫 Nothing to uninstall on Windows.'" }, auto_close_execution = false },
    { name = "📚 Docs", description = "Opens distrobox's own documentation site.", command = { linux_generic = "drako open https://distrobox.it", macos = "drako open https://distrobox.it", windows = "drako open https://distrobox.it" }, auto_close_execution = true }
]
