    ██░██░ ██░██░ ██░███████░███████░███████░██░ ██░
    ▓▓░▓▓░ ▓▓░▓▓▓▓▓░░▓▓░░░▓▓░▓▓░░░▓▓░▓▓░░░▓▓░░▓▓▓▓░░
    ██░██░ ██░██░██░ ██░    ░██░  ██░██░  ██░ ████░
    ▓▓░▓▓▓▓▓▓░▓▓░░▓▓░▓▓▓▓▓▓▓░▓▓▓▓▓▓▓░▓▓▓▓▓▓▓░▓▓░░▓▓░
██░ ██░░░░░░░░░░░ ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ ░░░
▓▓▓▓▓▓░
░░░░░░░
"""



