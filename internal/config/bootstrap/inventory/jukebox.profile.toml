[[commands]]
name = "🧰 cliamp setup"
description = "Getting cliamp onto this machine and keeping it fed. Check first, install second; the other two are for the two things that usually go wrong — silence on a PipeWire box, and formats that need ffmpeg or yt-dlp. Once it plays, you never need this cell again."
col = "B"
row = 2
items = [
  { name = "💻 Check", description = "Is it here, and where? Prints the path the shell would run, e.g. /home/you/go/bin/cliamp. Press this first — everything in the cliamp cell needs the binary on your PATH. Installed it with go and still told 'not installed'? Then ~/go/bin isn't on your PATH yet. cliamp has no --version flag; 'cliamp upgrade' pulls the latest release when you want to move forward.", command = '''
if command -v cliamp >/dev/null; then
  echo "✅ cliamp: $(command -v cliamp)"
else
  echo "❗ cliamp not installed — press 🧰 Install cliamp"
fi
''', auto_close_execution = false },

  { name = "🧰 Install cliamp", description = "Homebrew if you have it — the tap pulls the FLAC/Vorbis/Ogg/mpg123 codecs in for you. Otherwise your distro's ALSA and codec headers, then 'go install github.com/bjarneo/cliamp@latest', which drops the binary in ~/go/bin. Example on Debian: apt fetches libasound2-dev and friends, go builds it, done in about a minute.", command = { linux_immutable = "brew install bjarneo/cliamp/cliamp", linux_debian = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  sudo apt install -y libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev
  go install github.com/bjarneo/cliamp@latest
  echo "✅ Installed — add $(go env GOPATH)/bin to your PATH if it isn't there yet."
else
  echo "❓ Needs brew or go. Prebuilt binaries: https://github.com/bjarneo/cliamp/releases"
fi
""", linux_fedora = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  sudo dnf install -y alsa-lib-devel flac-devel libvorbis-devel libogg-devel mpg123-devel
  go install github.com/bjarneo/cliamp@latest
  echo "✅ Installed — add $(go env GOPATH)/bin to your PATH if it isn't there yet."
else
  echo "❓ Needs brew or go. Prebuilt binaries: https://github.com/bjarneo/cliamp/releases"
fi
""", linux_arch = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  sudo pacman -S --needed alsa-lib flac libvorbis libogg mpg123
  go install github.com/bjarneo/cliamp@latest
  echo "✅ Installed — add $(go env GOPATH)/bin to your PATH if it isn't there yet."
else
  echo "❓ Needs brew or go. There's also an AUR package: yay -S cliamp"
fi
""", linux_suse = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  sudo zypper install -y alsa-devel flac-devel libvorbis-devel libogg-devel mpg123-devel
  go install github.com/bjarneo/cliamp@latest
  echo "✅ Installed — add $(go env GOPATH)/bin to your PATH if it isn't there yet."
else
  echo "❓ Needs brew or go. Prebuilt binaries: https://github.com/bjarneo/cliamp/releases"
fi
""", linux_void = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  sudo xbps-install -Sy alsa-lib-devel libflac-devel libvorbis-devel libogg-devel mpg123-devel
  go install github.com/bjarneo/cliamp@latest
  echo "✅ Installed — add $(go env GOPATH)/bin to your PATH if it isn't there yet."
else
  echo "❓ Needs brew or go. Prebuilt binaries: https://github.com/bjarneo/cliamp/releases"
fi
""", linux_generic = """
if command -v brew >/dev/null; then
  brew install bjarneo/cliamp/cliamp
elif command -v go >/dev/null; then
  echo "❗ Install the ALSA and codec headers with your package manager first —"
