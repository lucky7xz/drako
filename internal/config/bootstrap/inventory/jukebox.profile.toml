[[commands]]
name = "🎧 Noise"
description = "Steady noise for focus and sleep — generated locally by mpv, no stream, works offline. Pink is balanced, brown is deep. Tune with 9/0."
col = "B"
row = 1
items = [
  { name = "🌸 Pink Noise", description = "Balanced and soft — the classic focus/sleep noise. Easy on the ears.", command = "mpv --no-video --volume=70 --force-media-title='🌸 Pink Noise' --msg-level=all=error,statusline=status --term-status-msg='  ♪  ${media-title}     🔊 ${volume}%    ⏱ ${playback-time}' av://lavfi:anoisesrc=color=pink:amplitude=0.3", auto_close_execution = false },
  { name = "🟤 Brown Noise", description = "Deep, low rumble — like distant surf. The cozy one for deep focus.", command = "mpv --no-video --volume=70 --force-media-title='🟤 Brown Noise' --msg-level=all=error,statusline=status --term-status-msg='  ♪  ${media-title}     🔊 ${volume}%    ⏱ ${playback-time}' av://lavfi:anoisesrc=color=brown:amplitude=0.3", auto_close_execution = false }
]

