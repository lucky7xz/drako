[[commands]]
name = "💿 cliamp"
description = "A Winamp for the terminal — the one cell here that plays music you already own. Spectrum visualiser, parametric EQ, and a playlist CLI that turns a music folder into a saved playlist in one keystroke. Everything below acts on the folder you launched drako from, so cd there first. Inside the player: Ctrl+K lists every key, p opens the playlist manager, R opens 30,000+ radio stations. Nothing here works until 🧰 cliamp setup has run."
col = "A"
row = 2
items = [
  { name = "🎵 Play this folder", description = "Opens the player on the current directory — plain 'cliamp .'. Example: 'cd ~/Music && drako', then press this and the whole folder is your queue. Works on a single album folder or a whole library; subfolders come along.", command = "cliamp .", auto_close_execution = false },

  { name = "📀 Playlist from this folder", description = "Saves the current folder as a playlist named after it. Example: run it from ~/Music/jazz and you get a playlist 'jazz' at ~/.config/cliamp/playlists/jazz.toml, loadable with 'cliamp --playlist jazz'. Subfolders are included, so a whole library becomes one big playlist. It's a snapshot of what's there right now — add music later with 'cliamp playlist add \"jazz\" ~/Music/jazz/new-album', or just press this again.", command = '''cliamp playlist create "$(basename "$PWD")" "$PWD"''', auto_close_execution = false },

  { name = "💽 One playlist per subfolder", description = "The other half of the pair: for a library of albums, each subfolder becomes its own playlist instead of one giant pile. Example: ~/Music holding dune/, ronin/ and blade-runner/ gives you three playlists under exactly those names. One level deep only — folders inside an album stay part of that album.", command = '''find "$PWD" -mindepth 1 -maxdepth 1 -type d -exec sh -c 'cliamp playlist create "$(basename "$1")" "$1"' _ {} \;''', auto_close_execution = false },

  { name = "📜 List playlists", description = "Every playlist cliamp knows — one line per .toml in ~/.config/cliamp/playlists/. Example output: jazz, dune, radio-stations. Play one with 'cliamp --playlist jazz', or press Esc (or b) inside the player to browse them.", command = "cliamp playlist list", auto_close_execution = false },

  { name = "🧹 Trash all playlists", description = "Clean slate that you can walk back: tells you how many playlists it found, waits for a y, then moves every one of them to ~/.config/cliamp/playlists-trash/ with a timestamp. Nothing is deleted. Example: jazz.toml becomes playlists-trash/jazz-20260823-191204.toml — invisible to cliamp, still on your disk. Bring one back by moving it home under its old name: mv ~/.config/cliamp/playlists-trash/jazz-20260823-191204.toml ~/.config/cliamp/playlists/jazz.toml. The trash sits beside the playlists folder rather than inside it, because cliamp loads every .toml it finds in there.", command = '''
d="$HOME/.config/cliamp/playlists"
t="$HOME/.config/cliamp/playlists-trash"
n=$(ls "$d"/*.toml 2>/dev/null | wc -l)
if [ "$n" -eq 0 ]; then
  echo "No playlists to trash."
  exit 0
fi
printf 'Move all %s playlists to the trash? [y/N] ' "$n"
read a
if [ "$a" = "y" ] || [ "$a" = "Y" ]; then
  mkdir -p "$t"
  stamp=$(date +%Y%m%d-%H%M%S)
  for f in "$d"/*.toml; do
    mv "$f" "$t/$(basename "$f" .toml)-$stamp.toml"
  done
  echo "🧹 All $n moved to $t — nothing deleted."
else
  echo "Cancelled — nothing moved."
fi
''', auto_close_execution = false }
]
