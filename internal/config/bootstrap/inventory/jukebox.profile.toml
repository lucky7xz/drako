# jukebox deck — a terminal radio with genuinely good sound.
# Stations (all show the live track title): SomaFM, Radio Swiss (jazz & classical),
# and a Curated folder — KCRW Eclectic24, Venice Classic Radio, dublab. A separate
# Noise folder generates pink/brown noise locally (offline, for focus & sleep).
# Music cells run mpv with loudnorm (EBU R128, target -16 LUFS) so channels sit at
# the same loudness and you stop chasing the volume between them.
# A single "now playing" line shows the live track, volume and elapsed time.
# While playing: space pause · 9/0 volume · q back.

X = 3
Y = 2

header_art= """
              ▓▓░
              ██░            ██░
