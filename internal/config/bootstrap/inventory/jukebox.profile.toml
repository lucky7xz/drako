  { name = "KCRW", description = "LA public radio — member-supported.", command = "xdg-open https://www.kcrw.com/donate", auto_close_execution = true },
  { name = "dublab", description = "LA nonprofit freeform radio.", command = "xdg-open https://dublab.com/donate", auto_close_execution = true }
]
