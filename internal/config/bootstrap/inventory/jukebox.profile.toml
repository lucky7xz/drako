fi
""", macos = "brew install bjarneo/cliamp/cliamp" }, auto_close_execution = false },

  { name = "🔌 No sound?", description = "Timer running, spectrum dancing, total silence? cliamp speaks ALSA, and PipeWire needs a bridge package to hear it. Example: 'sudo apt install pipewire-alsa', then start cliamp again. Still on PulseAudio? Then the package is pulseaudio-alsa on Arch, libasound2-plugins on Debian — install that one instead.", command = { linux_immutable = "echo '✅ The PipeWire ALSA bridge ships in the base image here — nothing to install.'", linux_debian = "sudo apt install -y pipewire-alsa", linux_fedora = "sudo dnf install -y pipewire-alsa", linux_arch = "sudo pacman -S --needed pipewire-alsa", linux_suse = "sudo zypper install -y pipewire-alsa", linux_void = "sudo xbps-install -Sy alsa-pipewire", linux_generic = "echo '❗ Install the ALSA bridge for your sound server: pipewire-alsa (PipeWire) or pulseaudio-alsa (PulseAudio).'", macos = "echo '🍏 macOS plays through CoreAudio — this one is a Linux-only fix.'" }, auto_close_execution = false },

  { name = "🧩 Extras", description = "Two optional companions: ffmpeg adds AAC, ALAC, Opus and WMA playback, yt-dlp adds YouTube, YouTube Music, SoundCloud and Bandcamp. Without them cliamp still plays MP3, FLAC, Ogg and WAV. Example: 'cliamp search \"blue monday\"' only works once yt-dlp is here. On Fedora and openSUSE this installs the patent-free ffmpeg build — the full one lives in RPM Fusion / Packman.", command = { linux_immutable = "brew install ffmpeg yt-dlp", linux_debian = "sudo apt install -y ffmpeg yt-dlp", linux_fedora = "sudo dnf install -y ffmpeg-free yt-dlp", linux_arch = "sudo pacman -S --needed ffmpeg yt-dlp", linux_suse = "sudo zypper install -y ffmpeg yt-dlp", linux_void = "sudo xbps-install -Sy ffmpeg yt-dlp", linux_generic = "echo '❗ Install ffmpeg and yt-dlp with your distro package manager.'", macos = "brew install ffmpeg yt-dlp" }, auto_close_execution = false },

