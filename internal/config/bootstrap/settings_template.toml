# dR4ko - Global Settings

# ┌─ Theme ──────────────────────────────────────────────────────────┐
# │ Select the color palette for the UI.
# │ Available themes:
# └──────────────────────────────────────────────────────────────────┘

theme = "dracula"
#theme = "jade"
#theme = "nord"
#theme = "dracula2"
#theme = "everforest"
#theme = "orasaka"

# ┌─ Auto Lock Session ──────────────────────────────────────────────────┐
# │ When enabled, drako will automatically lock after a period of inactivity.
# │ This prevents accidental key presses after a period of idle periods.
# │
# │ Recommended: Keep it enabled (default)
# └────────────────────────────────────────────────────────────┘
#auto_lock_enabled = false
#lock_timeout_minutes = 1 #

# ┌─ Key Bindings ─────────────────────────────────────────────┐
# │ Customize your control scheme.
# │ Arrows are always enabled.
# │ Defaults are shown commented out.
# └────────────────────────────────────────────────────────────┘

# ┌─ Keybinding Modifier ────────────────────────────────────┐
# │ Modifier for the profile-switch chord: <modifier> + 1-9.
# │ This is the legacy chord. The leader key 'm' (see below)
# │ is the modern way to switch profiles (m then 1-9) and the
# │ only way into batch mode (m then b).
# │ "alt" is the default; "ctrl" also works but may be
# │ intercepted by your terminal or window manager.
# │ Function keys (F1-F9) are not configured via this string.
# └───────────────────────────────────────────────────────────┘
numb_modifier = "alt"

[keys]
#disable_wasd_bindings = true
#disable_vim_bindings = true

#explain = "e"
#inventory = "i"
#path_grid_mode = "tab"
#lock = "r"

# Two different locks, one modifier apart:
#   lock          (r)      pins the active profile so launches stay on it
#   session_lock  (alt+r)  blanks the session behind the pump slider
# The session lock uses numb_modifier above, works from any screen, and does
# not need auto_lock_enabled — that setting only governs the idle timer.
#session_lock = "r"
profile_prev = "o"
profile_next = "p"

# In the inventory: open the highlighted profile in $EDITOR, or move it to
# trash/ (you type its name to confirm).
#edit_file = "e"
#delete = "delete"

# The leader arms a two-key sequence in the grid:
#   leader, 1-9  -> switch to profile 1-9
#   leader, b    -> batch mode (mark cells, launch them together)
# The legacy Alt+1-9 chord still works alongside it.
#leader = "m"

# ┌─ Batch Multiplexer ──────────────────────────────────────┐
# │ Batch mode runs the cells you marked side by side, in
# │ whichever multiplexer drako is already inside — herdr if
# │ you launched drako from a herdr pane, otherwise tmux.
# │ That way a batch never nests one inside the other.
# │
# │ Set this to run batches through tmux even from inside
# │ herdr. Everywhere else it changes nothing: outside herdr,
# │ tmux is already the only option.
# └──────────────────────────────────────────────────────────┘
#batch_force_tmux = true

# ┌─ Environment Variables ──────────────────────────────┐
# | By default, drako inherits your full shell environment
# | to ensure maximum compatibility with your tools.
# |
# | Uncomment 'env_whitelist' below to enable strict mode.
# | Only the listed variables will be passed to commands.
# | This is recommended for high-security setups.
# └──────────────────────────────────────────────────────┘
# env_whitelist = [
#     "PATH",
#     "HOME",
#     "USER",
#     "SHELL",
#     "TERM",
#     "LANG",
#     "LC_ALL",
#     "EDITOR",
#     "VISUAL",
#     "GOPATH",
#     "SSH_AUTH_SOCK"
# ]

# ┌─ Shell ────────────────────────────────────────┐
# | For each Profile (including the default), you
# | can set a custom shell to run the commands.
# | The default is bash (powershell on Windows),
# | though some profiles are POSIX compatible by
# | design, eg. for minimal server distros.
# └────────────────────────────────────────────────

#default_shell = "bash"   # or "zsh", "fish", "sh"; on Windows: "powershell" (5.1) or "pwsh" (7+)
