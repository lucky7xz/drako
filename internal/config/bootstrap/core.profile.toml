# dR4ko - Core Profile
# The default deck, shipped inside the binary. Commands use per-platform
# variant tables — drako resolves the right one for this machine when the
# profile loads. This file doubles as the reference example for variants.

# ┌─ Profile Settings ───────────────────────────────────────┐
# │ Customize the look and feel of this profile.
# └──────────────────────────────────────────────────────────┘
