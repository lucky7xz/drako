[[commands]]
name = "⬆️ System Update"
description = "Queries the repositories for fresh versions and pulls them into your system. Your digital infrastructure sheds old scales for new ones—staying sharp, staying current. The machinery needs to evolve or rust settles in."
command = { linux_debian = "sudo apt update && sudo apt upgrade", linux_arch = "sudo pacman -Syu", linux_fedora = "sudo dnf upgrade", linux_void = "sudo xbps-install -Su", linux_generic = """
# Unknown distro: probe the common package managers.
if command -v apt >/dev/null; then sudo apt update && sudo apt upgrade
elif command -v dnf >/dev/null; then sudo dnf upgrade
elif command -v pacman >/dev/null; then sudo pacman -Syu
elif command -v zypper >/dev/null; then sudo zypper update
elif command -v xbps-install >/dev/null; then sudo xbps-install -Su
elif command -v apk >/dev/null; then sudo apk upgrade
else echo "❓ No known package manager found — update with your distro's own tool."
fi
""", macos = "brew upgrade", windows = "winget upgrade --all" }
col = "A"
row = 0
auto_close_execution = false

[[commands]]
name = "🧹 Maintenance ⋮ "
description = "Maintenance and threat scanning. Clear out the debris, hunt for what shouldn't be there. A lean system moves faster."
col = "A"
row = 1
items = [
    { name = "Clean Packages", description = "Clears out the old scales your system sheds during updates. Removes what's no longer needed so nothing rots in the corners.", command = { linux_debian = "sudo apt autoremove", linux_arch = "sudo pacman -Sc", linux_fedora = "sudo dnf autoremove", linux_void = "sudo xbps-remove -Oo", linux_generic = """
if command -v apt >/dev/null; then sudo apt autoremove
elif command -v dnf >/dev/null; then sudo dnf autoremove
elif command -v pacman >/dev/null; then sudo pacman -Sc
elif command -v xbps-remove >/dev/null; then sudo xbps-remove -Oo
else echo "❓ No known package manager found — clean up with your distro's own tool."
fi
""", macos = "brew cleanup", windows = "echo 'Windows handles cleanup automatically'" }, auto_close_execution = false },
    { name = "Virus Scan (Home)", description = "Updates threat signatures and prowls through your home directory. Hunting for what doesn't belong.", command = { linux_generic = """
# Check if ClamAV is installed first
if ! command -v freshclam &> /dev/null || ! command -v clamscan &> /dev/null; then
    echo "❌ Error: ClamAV is not installed. Run the install command from Cell [C-0] first."
    sleep 1
    exit 1
fi

echo "🛡️  Initiating Security Protocol..."
echo "-----------------------------------"

# Step 1: Update
echo "📦 [1/2] Updating Virus Definitions..."
sudo freshclam || echo "⚠️  Update had warnings, proceeding to scan anyway..."

# Step 2: Scan
echo "-----------------------------------"
echo "🔍 [2/2] Scanning $HOME recursively..."
echo "ℹ️  NOTE: The scanner is in 'Infected-Only' mode."
echo "ℹ️  NOTE: In this mode, silence is GOOD. You will only see output if a threat is detected."
echo "⏳  Scanning now (this may take several minutes)..."

# Run scan
clamscan -r --bell -i "$HOME"

echo "-----------------------------------"
echo "✅ Scan complete."
""", macos = "echo 'No virus scanning needed by default'", windows = "Start-Process 'C:\\Program Files\\Windows Defender\\MpCmdRun.exe' -ArgumentList '-Scan -ScanType 2'" }, auto_close_execution = false }
]

[[commands]]
name = "👀 Process Monitor"
description = "Everything running right now, laid bare. Watch processes pulse, memory flow, CPU cycles burn. The system breathing beneath the surface. See what's moving in real-time."
command = { linux_generic = """
btop 2>/dev/null || {
    echo "btop not available. Defaulting to top..."
    top
}
""", macos = """
btop 2>/dev/null || {
    echo "btop not available. Defaulting to top..."
    top -o cpu
}
""", windows = "taskmgr" }
col = "A"
row = 2

