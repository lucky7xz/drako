[[commands]]
name = " 🔎 File Finder"
description = "Type and watch it hunt through thousands of files instantly. When your filesystem sprawls like endlessly, this cuts straight to what you're tracking. Fast, precise, relentless."
command = { linux_generic = "fzf --preview 'head -n 50 {}' --preview-window=right:50%:wrap --border --header '🔎 START TYPING TO SEARCH...'", macos = "fzf --preview 'head -n 50 {}' --preview-window=right:50%:wrap --border --header '🔎 START TYPING TO SEARCH...'", windows = "gci -Recurse | Where-Object { ! $_.PSIsContainer } | Out-GridView" }
col = "B"
row = 0
auto_close_execution = false

[[commands]]
name = "🌐 Bandwidth"
description = "Curious how much internet you're using right now? This opens up a little dashboard showing data going in and out. I find it mesmerizing to watch the numbers jump when I'm downloading a big file."
command = { linux_generic = """
bmon 2>/dev/null || {
    echo "bmon not available. Starting fallback monitor..."
    sleep 1
    while true; do
        clear
        cat /proc/net/dev | awk '
        NR>2 {
            # Capture stats
            recv[$1]=$2; trans[$1]=$10;
        }
        END {
            # Header
            printf "%-10s %15s %15s\\n", "IFACE", "RX (Bytes)", "TX (Bytes)"
            print "---------------------------------------------"
            # Print (Note: This is a simplified snapshot view)
            for (i in recv) {
                printf "%-10s %15s %15s\\n", i, recv[i], trans[i]
            }
        }'
        echo ""
        echo "Update: 1s | Press Ctrl+C to stop"
        sleep 1
    done
}""", macos = "nettop -P -L 1", windows = "typeperf \"\\Network Interface(*)\\Bytes Total/sec\"" }
col = "B"
row = 1


[[commands]]
name = "📊 System Status ⋮ "
description = "Vital signs and stats. Hardware details, disk territories mapped, or the weather beyond your screen. Information at different scales."
col = "B"
row = 2
items = [
    { name = "System Info", description = "The bones of your machine. Distro, kernel version, uptime, hardware beneath the surface. See what you're running on.", command = { linux_generic = """
fastfetch 2>/dev/null || neofetch 2>/dev/null || {
    if command -v lshw &> /dev/null; then
        echo "fastfetch/neofetch not found. Using lshw..."
        lshw -short
    else
        echo "System Info Tools missing. Fallback:"
        uname -sr
        grep PRETTY_NAME /etc/os-release 2>/dev/null | cut -d= -f2- | sed 's/"//g'
    fi
}
""", macos = "system_profiler SPSoftwareDataType SPDetailLevel=mini", windows = "systeminfo" }, auto_close_execution = false },
    { name = "Disk Usage", description = "Map of your storage. See where space went, find what's been forgotten in dusty corners.", command = { linux_generic = """
duf 2>/dev/null || {
    echo "duf not available. Defaulting to du..."
    du -h -d 1
}
""", macos = "du -h -d 1", windows = "drako internal open-url ms-settings:storage" }, auto_close_execution = false },
    { name = "Weather", description = "Quick weather from wttr.in. The world beyond the screen, right here in the terminal.", command = { linux_generic = "curl wttr.in", macos = "curl wttr.in", windows = "curl wttr.in" }, auto_close_execution = false }
]

