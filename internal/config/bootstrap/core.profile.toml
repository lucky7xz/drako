[[commands]]
name = "📜 Open Shell Config"
description = "This is where all your terminal customizations live. The shell config file loads every time you open a terminal and controls your aliases, environment variables, and prompt appearance. It's like the settings panel for your command line experience. I open this file whenever I want to add a new shortcut or tweak how my terminal behaves."
command = { linux_generic = "$EDITOR ~/.bashrc", macos = "$EDITOR ~/.zshrc", windows = "drako open $PROFILE" }
col = "C"
row = 1


