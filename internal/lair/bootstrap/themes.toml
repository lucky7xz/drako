# drako's colour palettes. Pick one in config.toml: theme = "jade".
#
# Change a colour here, or add a palette of your own under a new name; a
# colour you leave out keeps dracula's. drako draws on your terminal's own
# background and never paints one: Background is only used for text on filled
# buttons.
#
# "dracula" is the default and is built into drako, so it is not listed here.
# These are its colours. To change it, uncomment the block and edit it, or
# copy it under a new name.

# [dracula]
# Primary    = "#ff2e63" # Hot Pink
# Secondary  = "#ff8c00" # Vibrant Orange
# Background = "#0d0221" # Deep Purple
# Foreground = "#f0f0f0" # Very Light Gray
# Comment    = "#776ca0" # Muted Purple-Gray
# Success    = "#00f5d4" # Bright Aqua
# Warning    = "#f9f871" # Soft Lemon
# Error      = "#ff2e63" # Hot Pink
# Info       = "#00f5d4" # Bright Aqua
# Accent     = "#ff2e63" # Hot Pink

[dracula2]
Primary    = "#ff79c6" # Hot Pink
Secondary  = "#bd93f9" # Soft Purple
Foreground = "#f8f8f2" # Off-White
Background = "#282a36" # Deep Slate
Comment    = "#6f7eab" # Muted Blue-Gray
Success    = "#50fa7b" # Neon Green
Warning    = "#f1fa8c" # Pale Yellow
Error      = "#ff5555" # Bright Red
Info       = "#8be9fd" # Light Cyan
Accent     = "#ff79c6" # Hot Pink

