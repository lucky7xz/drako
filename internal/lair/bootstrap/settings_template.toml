# drako - global settings
#
# Lines that start with # are comments. A setting shown commented out is at
# its default; remove the # and change the value to override it.
# `drako check` reports a setting drako does not know.

# ── Theme ────────────────────────────────────────────────────────────
# The colour palette. Palettes live in themes.toml.

theme = "dracula"
#theme = "jade"
#theme = "nord"
#theme = "dracula2"
#theme = "everforest"
#theme = "orasaka"
#theme = "viper"

# ── Auto lock ────────────────────────────────────────────────────────
# After a while without a key press drako locks its screen, so a stray key
# cannot run a cell. On by default, after 5 minutes. To unlock, alternate
# left and right.

#auto_lock_enabled = false
#lock_timeout_minutes = 5

# ── Profile switch modifier ──────────────────────────────────────────
# <modifier> + 1-9 switches profile, <modifier> + session_lock locks the
# session. "alt" is the default.
# Note: "ctrl" does not work for 1-9. A terminal cannot send ctrl+1-9 to a
# program, so only the session lock would answer.
# The leader key (see below) does the same without a modifier: m, then 1-9.

numb_modifier = "alt"

# ── Shell ────────────────────────────────────────────────────────────
# The shell cells run in. A profile may set its own.
# "bash" (default), "zsh", "fish", "sh";
# on Windows "powershell" (5.1, default) or "pwsh" (7+).

#default_shell = "bash"

# ── Batch multiplexer ────────────────────────────────────────────────
# A batch runs the cells you marked side by side, in the multiplexer drako
# is already inside: herdr if you started drako from a herdr pane, else
# tmux. Set this to use tmux even from inside herdr.

#batch_force_tmux = true

# ── Keys ─────────────────────────────────────────────────────────────
# Arrows always work. Defaults are shown commented out.

[keys]
#disable_wasd_bindings = true
#disable_vim_bindings = true

#explain = "e"
#inventory = "i"
#path_grid_mode = "tab"

# Two different things, one modifier apart:
#   lock          (r)      pins the active profile, so drako starts on it
#   session_lock  (alt+r)  locks the screen; uses numb_modifier above and
#                          works from any screen, with auto lock on or off
#lock = "r"
#session_lock = "r"

profile_prev = "o"
profile_next = "p"

# In the inventory: open the highlighted profile in $EDITOR, or move it to
# trash/ (you type its name to confirm).
#edit_file = "e"
#delete = "delete"

# In path mode: filter the folder list as you type, or show hidden entries.
# path_search and edit_file both default to "e"; they never meet, since one
# works only in path mode and the other only in the inventory.
#path_search = "e"
#toggle_hidden = "."

# The leader starts a two-key sequence in the grid:
#   leader, 1-9  switch to profile 1-9
#   leader, b    batch mode (mark cells, launch them together)
#leader = "m"

# Opens the key sheet: every key for every screen, your remaps included.
#help = "?"
