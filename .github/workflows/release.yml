name: release

# Build and publish a GitHub Release whenever a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # required for GoReleaser to create the release
  id-token: write       # sign the build provenance
  attestations: write   # and store it

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags (changelog & version)

      - uses: actions/setup-go@v5
        with:
          go-version: stable    # build with the latest stable Go

      # A tag only ships if the suite passes on it.
      - run: go vet ./...
      - run: go test ./...

      # Hand-written notes for this tag, if it has any, go above GoReleaser's
      # changelog: .github/release-notes/<tag>.md (e.g. v0.4.3.md). One file
      # per tag, so last release's notes can never ride along on this one.
      - name: Release notes header
        id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "args=--release-header $f" >> "$GITHUB_OUTPUT"; fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'      # matches `version: 2` in .goreleaser.yaml
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lets anyone check a download was built here:
      #   gh attestation verify <file> -R lucky7xz/drako
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt
